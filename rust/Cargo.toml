[workspace]
members = [
  "crates/code_hygiene",
  "crates/quality_gate",
  "crates/architecture_review",
  "crates/authoring_project_context",
  "crates/project_authoring_execution",
  "crates/engine_input",
  "crates/project_runtime_abi",
  "crates/engine_public_api",
  "crates/project_runtime_sdk",
  "crates/project_game_sdk",
  "crates/engine_content",
  "crates/engine_text",
  "crates/engine_render_resources",
  "crates/engine_navigation_native",
  "crates/engine_runtime_core",
  "crates/engine_render_native",
  "crates/engine_runtime",
  "crates/engine_runtime_host",
  "crates/editor_ui_model",
  "crates/editor_core",
  "crates/engine_tool_provider",
  "crates/editor_ui_backend_egui",
  "crates/editor_ui_renderer",
  "crates/editor_wgpu_renderer",
  "crates/editor_input",
  "crates/editor_window_winit",
  "crates/editor_host",
  "crates/project_e2e_gate",
  "crates/runtime_cli",
  "crates/runtime_player_winit",
  "crates/runtime_player_android",
  "crates/runtime_player_web",
  "project_players/empty",
]
exclude = ["crates/engine_spine_runtime"]
resolver = "2"

[workspace.package]
edition = "2021"
license = "UNLICENSED"
publish = false

[workspace.lints.rust]
warnings = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
correctness = { level = "deny", priority = 0 }

# Development correctness feedback only. Release performance keeps Cargo's
# unchanged release profile. A separate name preserves the existing test cache.
[profile.dev-fast]
inherits = "dev"
debug = "line-tables-only"

# Same-version lifetime correction; see native vendor provenance.
[patch.crates-io]
wgpu = { path = "crates/engine_render_native/vendor/wgpu" }
