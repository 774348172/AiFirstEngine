[package]
name = "editor_core"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
build = "build.rs"

[lints]
workspace = true

[lib]
path = "src/lib.rs"

[dependencies]
cap-std = "4.0.2"
engine_input = { path = "../engine_input" }
engine_runtime = { path = "../engine_runtime" }
editor_ui_model = { path = "../editor_ui_model" }
runtime_cli = { path = "../runtime_cli" }
schemars = "1.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
semver = "1"
sha2 = "0.10"
toml = "0.8"
url = "2.5"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros"] }
tokio-util = { version = "0.7", features = ["rt"] }
zeroize = "1.8"
png = "0.17"
editpe = { version = "=0.2.3", default-features = false, features = ["std"] }
ttf-parser = "=0.25.1"
swash = "=0.2.10"
fdsm = "=0.8.0"
fdsm-ttf-parser = "=0.2.0"
image = { version = "=0.25.6", default-features = false }
nalgebra = "=0.34.1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_System_SystemInformation",
] }

[build-dependencies]
serde_json = "1"
