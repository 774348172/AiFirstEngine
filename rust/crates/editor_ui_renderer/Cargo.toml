[package]
name = "editor_ui_renderer"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[lib]
path = "src/lib.rs"

[dependencies]
engine_runtime = { path = "../engine_runtime" }
editor_ui_model = { path = "../editor_ui_model" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
taffy = { version = "0.12.1", default-features = false, features = ["std", "taffy_tree", "flexbox", "block_layout", "content_size"] }
