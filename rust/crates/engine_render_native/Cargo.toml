[package]
name = "engine_render_native"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[lib]
test = false
doctest = false

[dependencies]
engine_runtime_core = { path = "../engine_runtime_core" }
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
wgpu = { version = "26", optional = true }
bytemuck = { version = "1", features = ["derive"], optional = true }
pollster = { version = "0.4", optional = true }

[features]
default = []
real-wgpu = ["engine_runtime_core/real-wgpu", "dep:wgpu", "dep:bytemuck", "dep:pollster"]

[dev-dependencies]
engine_runtime_core = { path = "../engine_runtime_core", features = ["spine"] }
engine_spine_runtime = { path = "../engine_spine_runtime" }
png = "0.17"
