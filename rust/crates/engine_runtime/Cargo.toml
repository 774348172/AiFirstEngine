[package]
name = "engine_runtime"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[lib]
path = "src/lib.rs"

[dependencies]
engine_input = { path = "../engine_input" }
project_runtime_abi = { path = "../project_runtime_abi" }
project_runtime_sdk = { path = "../project_runtime_sdk" }
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
rustybuzz = "0.20"
sha2 = "0.10"
hound = "3.5.1"
wgpu = { version = "26", optional = true }
bytemuck = { version = "1", features = ["derive"], optional = true }
pollster = { version = "0.4", optional = true }

[features]
default = []
real-wgpu = ["dep:wgpu", "dep:bytemuck", "dep:pollster"]

[dev-dependencies]
png = "0.17"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_System_LibraryLoader"] }
