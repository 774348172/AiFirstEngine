[package]
name = "engine_spine_runtime"
version = "0.1.0"
edition = "2024"
publish = false

# Gate A is intentionally isolated from the concurrently changing engine workspace.
# Integration into its workspace is a later, separately authorized Gate.
[workspace]

[dependencies]
serde = "1"
serde_json = "1"
sha2 = "0.10"

[build-dependencies]
cc = "=1.4.4"

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
undocumented_unsafe_blocks = "deny"
