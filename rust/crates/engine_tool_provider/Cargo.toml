[package]
name = "engine_tool_provider"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[lib]
path = "src/lib.rs"

[dependencies]
authoring_project_context = { path = "../authoring_project_context" }
project_authoring_execution = { path = "../project_authoring_execution" }
