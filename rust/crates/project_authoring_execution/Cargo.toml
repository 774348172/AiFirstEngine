[package]
name = "project_authoring_execution"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
build = "build.rs"

[lints]
workspace = true

[lib]
path = "src/lib.rs"

[features]
real-wgpu = ["engine_runtime/real-wgpu"]

[dependencies]
authoring_project_context = { path = "../authoring_project_context" }
cap-std = "4.0.2"
engine_runtime = { path = "../engine_runtime" }
project_game_sdk = { path = "../project_game_sdk" }
project_runtime_sdk = { path = "../project_runtime_sdk" }
fdsm = "=0.8.0"
fdsm-ttf-parser = "=0.2.0"
image = { version = "=0.25.6", default-features = false }
nalgebra = "=0.34.1"
naga = { version = "26", features = ["wgsl-in"] }
png = "0.17"
schemars = "1.2"
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
swash = "=0.2.10"
runtime_cli = { path = "../runtime_cli" }
runtime_player_winit = { path = "../runtime_player_winit" }
ttf-parser = "=0.25.1"
toml = "0.8"

[build-dependencies]
serde_json = "1"
