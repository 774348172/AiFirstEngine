[package]
name = "project_e2e_gate"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[lib]
path = "src/lib.rs"

[dependencies]
engine_tool_provider = { path = "../engine_tool_provider" }
editor_core = { path = "../editor_core" }
editor_ui_model = { path = "../editor_ui_model" }
engine_input = { path = "../engine_input" }
engine_runtime = { path = "../engine_runtime" }
project_authoring_execution = { path = "../project_authoring_execution" }
project_runtime_abi = { path = "../project_runtime_abi" }
project_runtime_sdk = { path = "../project_runtime_sdk" }
runtime_cli = { path = "../runtime_cli", features = ["real-window"] }
runtime_player_winit = { path = "../runtime_player_winit" }
png = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
editpe = { version = "=0.2.3", default-features = false, features = ["std"] }
