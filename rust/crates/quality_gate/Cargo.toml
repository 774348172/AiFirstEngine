[package]
name = "quality_gate"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "quality_gate"
path = "src/main.rs"

[dependencies]
code_hygiene = { path = "../code_hygiene" }
quote = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
syn = { version = "2", features = ["full", "visit", "parsing"] }
toml = "0.8"
