[package]
name = "runtime_player_android"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[lib]
path = "src/lib.rs"

[dependencies]
engine_runtime = { path = "../engine_runtime" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(target_os = "android")'.dependencies]
project_runtime_abi = { path = "../project_runtime_abi" }
runtime_player_winit = { path = "../runtime_player_winit", features = ["real-window"] }
winit = { version = "0.30", features = ["android-game-activity"] }
