[package]
name = "runtime_player_web"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
engine_runtime_core = { path = "../engine_runtime_core", features = ["real-wgpu"] }
engine_render_native = { path = "../engine_render_native", features = ["real-wgpu"] }
engine_content = { path = "../engine_content" }
engine_input = { path = "../engine_input" }
project_runtime_abi = { path = "../project_runtime_abi" }
wgpu = "26"
wasm-bindgen = "=0.2.125"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["HtmlCanvasElement", "console"] }
serde_json = "1"
