[package]
name = "runtime_player_winit"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[lib]
path = "src/lib.rs"

[dependencies]
engine_input = { path = "../engine_input" }
engine_runtime = { path = "../engine_runtime" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
winit = { version = "0.30", optional = true }
wgpu = { version = "26", optional = true }
pollster = { version = "0.4", optional = true }

[features]
default = []
real-window = ["dep:winit", "dep:wgpu", "dep:pollster", "engine_runtime/real-wgpu"]

